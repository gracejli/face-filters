<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Face Filters</h1>
      <label class="switch" title="Turn filters on or off">
        <input id="enabled" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <fieldset id="filters">
      <legend>Filter</legend>
    </fieldset>

    <p class="note">Faces are detected on this device. No images leave your computer.</p>
    <script src="popup.js"></script>
  </body>
</html>
