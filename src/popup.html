<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Face Hack</h1>
      <label class="switch" title="Turn filters on or off">
        <input id="enabled" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <fieldset id="filters">
      <legend class="visually-hidden">Filter</legend>
    </fieldset>

    <div id="body-options" class="body-options" hidden>
      <div id="body-styles" class="segmented" role="radiogroup" aria-label="Body style"></div>
      <div id="swatches" class="swatches" role="group" aria-label="Color"></div>
      <div id="image-row" class="image-row" hidden>
        <img id="image-thumb" alt="Current image" />
        <button id="upload" type="button">Upload image</button>
      </div>
    </div>

    <div id="card-row" class="image-row card-row" hidden>
      <img id="card-thumb" alt="Current headband picture" />
      <button id="card-upload" type="button">Upload picture</button>
    </div>

    <div id="amount" class="amount" hidden>
      <label for="amount-input" id="amount-label">Strength</label>
      <div class="slider">
        <span class="end small" aria-hidden="true"></span>
        <input id="amount-input" type="range" min="0" max="100" step="1" />
        <span class="end large" aria-hidden="true"></span>
      </div>
    </div>

    <p class="note">Faces are detected on this device. No images leave your computer.</p>
    <script src="popup.js"></script>
  </body>
</html>
